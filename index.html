<html lang="en">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Mercado</title>
</head>
<body>
    <section>

        <p>Mande meu pix</p>

        <button>Pagar</button>

        <p id="resultado"></p>
